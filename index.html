<!DOCTYPE html>
<html lang="id" data-tema="raspberry">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Selamat Ulang Tahun!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#e0245e;--plum:#3b0a45;--sun:#ffd23f;--mint:#7ee8c7;--paper:#fff7f0;
--display:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;--text:'DM Sans',system-ui,sans-serif}
html[data-tema="laut"]{--bg:#1f6fe0}
html[data-tema="hutan"]{--bg:#13805f}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--paper);font-family:var(--text);overflow-x:hidden}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:color-mix(in srgb,var(--bg) 80%,#000)}}
:root[data-theme="dark"] body{background:color-mix(in srgb,var(--bg) 80%,#000)}
.bunting{display:flex;justify-content:space-between;height:44px;overflow:hidden;position:relative;border-top:3px solid var(--plum)}
.bunting i{flex:1;max-width:60px;clip-path:polygon(0 0,100% 0,50% 100%)}
main{max-width:560px;margin:0 auto;padding:12px 20px 44px;text-align:center;position:relative;z-index:2}
h1{font-family:var(--display);font-weight:400;margin:8px 0 0;line-height:.92;font-size:clamp(3.4rem,17vw,6.4rem);color:var(--sun);text-shadow:4px 4px 0 var(--plum)}
h1 span{display:block}
h1 span:nth-child(2){transform:translateX(-6%) rotate(-2deg)}
h1 span:nth-child(3){transform:translateX(5%) rotate(1.5deg)}
.name{display:inline-block;margin-top:22px;padding:8px 22px;background:var(--paper);color:var(--plum);border-radius:999px;font-family:var(--display);font-size:clamp(1.3rem,6vw,1.9rem);box-shadow:3px 3px 0 var(--plum);transform:rotate(-1.5deg)}
.photo{display:none;width:170px;margin:22px auto 0;padding:10px 10px 28px;background:var(--paper);box-shadow:5px 5px 0 var(--plum);transform:rotate(2.5deg)}
.photo.on{display:block}
.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.stage{position:relative;margin:20px auto 0;width:min(340px,86vw);cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage svg{width:100%;height:auto;display:block;overflow:visible}
.badge{position:absolute;right:-8px;top:34px;width:76px;height:76px;border-radius:50%;background:var(--sun);color:var(--plum);border:3px solid var(--plum);box-shadow:3px 3px 0 var(--plum);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:1.9rem;line-height:1;transform:rotate(12deg)}
.badge small{font:600 .7rem var(--text)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .45s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.86,1.14) rotate(3deg)}}
.smoke{opacity:0;transform-box:fill-box;transform-origin:center}
.out .flame{display:none}
.out .smoke{animation:puff 1.6s ease-out forwards}
@keyframes puff{0%{opacity:.8;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-46px) scale(1.7)}}
.hint{margin:8px 0 0;min-height:1.5em}
.btns{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button,.btn{font:600 1rem var(--text);color:var(--plum);background:var(--mint);border:3px solid var(--plum);border-radius:999px;padding:11px 20px;cursor:pointer;box-shadow:0 4px 0 var(--plum);text-decoration:none;display:inline-block}
.alt{background:var(--sun)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--plum)}
:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
.wish{max-height:0;opacity:0;overflow:hidden;transition:max-height .7s ease,opacity .7s ease}
.wish.on{max-height:520px;opacity:1}
.wish p{margin:22px 0 0;padding:20px 22px;background:var(--paper);color:var(--plum);border:3px solid var(--plum);border-radius:18px 18px 18px 4px;box-shadow:6px 6px 0 var(--plum);font-size:1.12rem;line-height:1.6;text-align:left;min-height:5em}
h2{font-family:var(--display);font-weight:400;font-size:1.6rem;margin:38px 0 4px;color:var(--sun);text-shadow:2px 2px 0 var(--plum)}
.bals{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.bal{width:62px;height:96px;padding:0;border:0;background:none;box-shadow:none;position:relative;animation:bob 3s ease-in-out infinite;transition:transform .15s}
.bal::before{content:"";position:absolute;left:0;top:0;width:62px;height:76px;border-radius:50% 50% 48% 48%;background:var(--c);border:3px solid var(--plum)}
.bal::after{content:"";position:absolute;left:30px;top:76px;width:2px;height:20px;background:var(--plum)}
.bal:nth-child(2){animation-delay:.4s}.bal:nth-child(3){animation-delay:.8s}.bal:nth-child(4){animation-delay:1.2s}.bal:nth-child(5){animation-delay:1.6s}
@keyframes bob{50%{transform:translateY(-10px)}}
.bal.pop{transform:scale(0);opacity:0;pointer-events:none;animation:none}
.doa{list-style:none;padding:0;margin:12px 0 0}
.doa li{background:var(--paper);color:var(--plum);border:3px solid var(--plum);border-radius:14px;padding:10px 16px;margin:8px 0;font-weight:600;box-shadow:3px 3px 0 var(--plum)}
details{margin-top:36px;text-align:left;background:rgba(59,10,69,.6);border-radius:16px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
label{display:block;margin-top:12px;font-size:.95rem}
input[type=text],input[type=number],textarea{width:100%;margin-top:4px;padding:10px 12px;font:inherit;color:var(--plum);background:var(--paper);border:2px solid var(--plum);border-radius:10px}
textarea{min-height:90px;resize:vertical}
.sw{display:flex;gap:10px;margin-top:6px}
.sw button{width:44px;height:44px;padding:0;border-radius:50%;box-shadow:none}
#intro{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#intro.gone{opacity:0;visibility:hidden}
#intro h3{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,8vw,2.8rem);color:var(--sun);text-shadow:3px 3px 0 var(--plum);margin:0}
.gift{width:190px;cursor:pointer;animation:bob 2s ease-in-out infinite}
.lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:0 100%}
.open .lid{transform:translateY(-50px) rotate(-14deg)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="intro">
  <h3 id="iname">Ada kado untuk abii</h3>
  <svg class="gift" id="gift" viewBox="0 0 190 170" role="button" tabindex="0" aria-label="Buka kado">
    <rect x="20" y="70" width="150" height="95" rx="8" fill="#ffd23f" stroke="#3b0a45" stroke-width="4"/>
    <rect x="88" y="70" width="14" height="95" fill="#e0245e" stroke="#3b0a45" stroke-width="3"/>
    <g class="lid"><rect x="10" y="42" width="170" height="34" rx="8" fill="#7ee8c7" stroke="#3b0a45" stroke-width="4"/>
    <rect x="88" y="42" width="14" height="34" fill="#e0245e" stroke="#3b0a45" stroke-width="3"/>
    <path d="M95 42c-30-30-50-10-30 0zM95 42c30-30 50-10 30 0z" fill="#e0245e" stroke="#3b0a45" stroke-width="4"/></g>
  </svg>
  <button type="button" id="openBtn" class="alt">Buka kado</button>
</div>
<div class="bunting" id="bunt" aria-hidden="true"></div>
<main>
  <h1><span>Selamat</span><span>Ulang</span><span>Tahun!</span></h1>
  <div class="name" id="who">my superhero</div>
  <div class="photo" id="photo"><img id="pimg" alt="Foto yang dirayakan"></div>
  <div class="stage" id="stage" role="button" tabindex="0" aria-label="Ketuk untuk meniup lilin">
    <svg viewBox="0 0 300 250" aria-hidden="true">
      <ellipse cx="150" cy="232" rx="140" ry="14" fill="#3b0a45"/>
      <rect x="40" y="150" width="220" height="78" rx="14" fill="#3b0a45"/>
      <path d="M40 164c0-8 6-14 14-14h192c8 0 14 6 14 14v6c-10 14-20-2-32 6s-22-2-34 6-22-2-34 6-22-2-34 6-22-2-34 6-14-4-20 2z" fill="#fff7f0"/>
      <g fill="#ffd23f"><circle cx="66" cy="200" r="4"/><circle cx="108" cy="212" r="4"/><circle cx="150" cy="200" r="4"/><circle cx="194" cy="212" r="4"/><circle cx="236" cy="200" r="4"/></g>
      <rect x="75" y="100" width="150" height="56" rx="12" fill="#7ee8c7" stroke="#3b0a45" stroke-width="3"/>
      <path d="M75 112c0-6 5-12 12-12h126c7 0 12 6 12 12v4c-8 10-16-2-26 4s-18-2-28 4-18-2-28 4-18-2-28 4-14-2-20 2z" fill="#fff7f0"/>
      <g id="candles"></g>
    </svg>
    <div class="badge" id="badge"><span id="age">17</span><small>tahun</small></div>
  </div>
  <p class="hint" id="hint"></p>
  <div class="btns">
    <button type="button" id="blow">Tiup lilin</button>
    <button type="button" id="mic" class="alt">Tiup lewat mikrofon</button>
    <button type="button" id="again" class="alt" hidden>Nyalakan lagi</button>
    <button type="button" id="music">Putar lagu</button>
  </div>
  <div class="wish" id="wish"><p id="msg"></p></div>

  <h2>Pecahkan balon</h2>
  <div class="bals" id="bals"></div>
  <ul class="doa" id="doa" aria-live="polite"></ul>

  <details>
    <summary>Ubah ucapan, foto, dan tema</summary>
    <label>Nama penerima<input type="text" id="inName" maxlength="40" placeholder="Contoh: Budi"></label>
    <label>Umur<input type="number" id="inAge" min="1" max="99" placeholder="17"></label>
    <label>Pesan ucapan<textarea id="inMsg" maxlength="400" placeholder="Tulis ucapanmu di sini"></textarea></label>
    <label>Foto (hanya tampil di perangkat ini)<input type="file" id="inPic" accept="image/*"></label>
    <label>Warna tema</label>
    <div class="sw" id="sw">
      <button type="button" data-t="raspberry" style="background:#e0245e" aria-label="Raspberry"></button>
      <button type="button" data-t="laut" style="background:#1f6fe0" aria-label="Laut"></button>
      <button type="button" data-t="hutan" style="background:#13805f" aria-label="Hutan"></button>
    </div>
    <div class="btns"><button type="button" id="copy">Salin tautan</button><a class="btn alt" id="wa" target="_blank" rel="noopener">Kirim lewat WhatsApp</a></div>
  </details>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cols=['#ffd23f','#7ee8c7','#fff7f0','#3b0a45','#ff9d1c','#e0245e'];
var DEF='Semoga hari ini penuh tawa, sehat selalu, dan semua impianmu satu per satu jadi nyata. Terima kasih sudah jadi bagian dari cerita kami.';
var DOA=['Sehat selalu dan panjang umur','Rezeki lancar, hati tenang','Semua cita-cita satu per satu terwujud','Dikelilingi orang-orang yang menyayangimu','Tahun ini lebih bahagia dari tahun lalu'];
var BC=['#ff9d1c','#7ee8c7','#ffd23f','#fff7f0','#b58cff'];
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var st={nama:'',umur:17,pesan:'',tema:'raspberry'};
var p=new URLSearchParams(location.search);
st.nama=p.get('nama')||'';st.pesan=p.get('pesan')||'';
if(+p.get('umur')>0)st.umur=Math.min(99,+p.get('umur'));
if(['raspberry','laut','hutan'].indexOf(p.get('tema'))>-1)st.tema=p.get('tema');

var b=$('bunt');for(var i=0;i<14;i++){var f=document.createElement('i');f.style.background=cols[i%4];b.appendChild(f)}

/* kanvas confetti */
var cv=$('fx'),x=cv.getContext('2d'),W,H,parts=[],run=false;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',size);size();
function spawn(px,py,n,a0,sp,v){if(reduce)return;
 for(var i=0;i<n;i++){var a=a0+(Math.random()-.5)*sp,s=v*(.4+Math.random()*.6);
  parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,s:Math.random()*8+5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,o:i%3===0})}
 if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){x.clearRect(0,0,W,H);parts=parts.filter(function(q){return q.y<H+30});
 parts.forEach(function(q){q.vy+=.35;q.vx*=.99;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;
  if(q.o){x.beginPath();x.arc(0,0,q.s/2,0,6.3);x.fill()}else x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});
 if(parts.length)requestAnimationFrame(tick);else{run=false;x.clearRect(0,0,W,H)}}
function cannons(){spawn(0,H,90,-Math.PI/3,.8,19);spawn(W,H,90,-2*Math.PI/3,.8,19)}

/* tampilan */
function candles(){var n=Math.min(st.umur,9),g='',gap=n>1?Math.min(30,130/(n-1)):0;
 for(var i=0;i<n;i++){var cx=150+(i-(n-1)/2)*gap,d=(i*.13).toFixed(2);
  g+='<path d="M'+cx+' 100V66" stroke="#3b0a45" stroke-width="3" stroke-linecap="round"/>'+
  '<g transform="translate('+cx+',63)"><g class="flame" style="animation-delay:'+d+'s"><path d="M0-25c9 11 9 20 0 25-9-5-9-14 0-25z" fill="#ff9d1c"/><path d="M0-16c5 6 5 11 0 14-5-3-5-8 0-14z" fill="#ffe27a"/></g>'+
  '<circle class="smoke" cy="-14" r="7" fill="#fff7f0" style="animation-delay:'+d+'s"/></g>'}
 $('candles').innerHTML=g}
function render(){var n=st.nama.trim()||'My Super Hero';
 $('who').textContent=n;$('iname').textContent=st.nama.trim()?'Ada kado untuk '+st.nama.trim()+'!':'Ada kado abii!';
 $('age').textContent=st.umur;$('msg').dataset.t=st.pesan.trim()||DEF;
 document.documentElement.dataset.tema=st.tema;candles();link()}
function link(){var u=new URL(location.href.split('?')[0]);
 if(st.nama.trim())u.searchParams.set('nama',st.nama.trim());
 if(st.pesan.trim())u.searchParams.set('pesan',st.pesan.trim());
 u.searchParams.set('umur',st.umur);u.searchParams.set('tema',st.tema);
 link.url=u.toString();
 $('wa').href='https://wa.me/?text='+encodeURIComponent('Selamat ulang tahun! Buka kejutanmu di sini: '+link.url)}

/* lilin */
var stage=$('stage'),wish=$('wish'),hint=$('hint'),timer;
function typeMsg(){var t=$('msg').dataset.t,el=$('msg'),i=0;clearInterval(timer);
 if(reduce){el.textContent=t;return}el.textContent='';
 timer=setInterval(function(){el.textContent=t.slice(0,++i);if(i>=t.length)clearInterval(timer)},28)}
function out(){if(stage.classList.contains('out'))return;stopMic();
 stage.classList.add('out');wish.classList.add('on');hint.textContent='Semoga permohonanmu terkabul!';
 $('blow').hidden=$('mic').hidden=true;$('again').hidden=false;cannons();typeMsg()}
function relight(){stage.classList.remove('out');wish.classList.remove('on');clearInterval(timer);
 hint.textContent='Pejamkan mata, buat permohonan, lalu tiup lilinnya.';$('blow').hidden=$('mic').hidden=false;$('again').hidden=true}
stage.addEventListener('click',out);
stage.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();out()}});
$('blow').addEventListener('click',out);$('again').addEventListener('click',relight);

/* mikrofon */
var ms=null,ma=null,listening=false;
function stopMic(){listening=false;if(ms){ms.getTracks().forEach(function(t){t.stop()});ms=null}if(ma){try{ma.close()}catch(e){}ma=null}}
$('mic').addEventListener('click',function(){
 if(listening){stopMic();hint.textContent='Mikrofon dimatikan. Ketuk kue untuk meniup.';return}
 try{navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
  ms=s;ma=new (window.AudioContext||window.webkitAudioContext)();var an=ma.createAnalyser();an.fftSize=512;
  ma.createMediaStreamSource(s).connect(an);var buf=new Uint8Array(an.fftSize),hits=0;listening=true;
  hint.textContent='Tiup ke arah mikrofon...';
  (function loop(){if(!listening)return;an.getByteTimeDomainData(buf);var sum=0;
   for(var i=0;i<buf.length;i++){var v=(buf[i]-128)/128;sum+=v*v}
   hits=Math.sqrt(sum/buf.length)>.18?hits+1:Math.max(0,hits-1);
   if(hits>8){out();return}requestAnimationFrame(loop)})()
 }).catch(function(){hint.textContent='Mikrofon tidak tersedia. Ketuk kue untuk meniup.'})}
 catch(e){hint.textContent='Mikrofon tidak tersedia. Ketuk kue untuk meniup.'}});

/* lagu (nada dibangkitkan langsung di browser) */
var N=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],
[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,1],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
var ac=null,mt;
function stopSong(){clearTimeout(mt);if(ac){try{ac.close()}catch(e){}ac=null}$('music').textContent='Putar lagu'}
$('music').addEventListener('click',function(){
 if(ac){stopSong();return}
 try{ac=new (window.AudioContext||window.webkitAudioContext)();var t=ac.currentTime+.05,bt=.42;
  N.forEach(function(n){var o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n[0];
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+n[1]*bt);
   o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+n[1]*bt+.05);t+=n[1]*bt});
  $('music').textContent='Hentikan lagu';mt=setTimeout(stopSong,(t-ac.currentTime)*1000+200)}
 catch(e){hint.textContent='Audio tidak tersedia di perangkat ini.'}});

/* balon */
var left=DOA.length;
BC.forEach(function(c,i){var bl=document.createElement('button');bl.type='button';bl.className='bal';bl.style.setProperty('--c',c);bl.setAttribute('aria-label','Balon doa '+(i+1));
 bl.addEventListener('click',function(){var r=bl.getBoundingClientRect();spawn(r.left+31,r.top+38,40,-Math.PI/2,Math.PI*2,9);bl.classList.add('pop');
  var li=document.createElement('li');li.textContent=DOA[i];$('doa').appendChild(li);
  if(--left===0){var d=document.createElement('li');d.textContent='Semua doa sudah terbuka!';d.style.background='var(--sun)';$('doa').appendChild(d);cannons()}});
 $('bals').appendChild(bl)});

/* pengaturan */
$('inName').addEventListener('input',function(e){st.nama=e.target.value;render()});
$('inAge').addEventListener('input',function(e){var v=Math.max(1,Math.min(99,+e.target.value||0));if(v){st.umur=v;render()}});
$('inMsg').addEventListener('input',function(e){st.pesan=e.target.value;render();if(wish.classList.contains('on'))typeMsg()});
$('sw').addEventListener('click',function(e){var t=e.target.dataset.t;if(t){st.tema=t;render()}});
$('inPic').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){$('pimg').src=r.result;$('photo').classList.add('on')};r.readAsDataURL(f)});
$('copy').addEventListener('click',function(){var bt=$('copy');
 try{navigator.clipboard.writeText(link.url).then(function(){bt.textContent='Tautan tersalin'},function(){bt.textContent='Gagal menyalin'})}
 catch(e){bt.textContent='Gagal menyalin'}});
$('inName').value=st.nama;$('inAge').value=st.umur;$('inMsg').value=st.pesan;

/* kado pembuka */
var opened=false;
function openGift(){if(opened)return;opened=true;$('intro').classList.add('open');
 setTimeout(function(){$('intro').classList.add('gone');cannons()},reduce?0:650)}
$('openBtn').addEventListener('click',openGift);$('gift').addEventListener('click',openGift);
$('gift').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openGift()}});
render();relight();
})();
</script>
</body>
</html>
